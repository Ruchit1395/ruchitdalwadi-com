name: Story factory

on:
  schedule:
    - cron: "30 2 * * 0" # Sunday 08:00 IST: fill Mon/Wed/Fri banks for the week
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: story-factory
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate, judge, and ship the week's story posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/story-factory.mjs
      - name: Commit the week's bank
        run: |
          git config user.name "campaign-bot"
          git config user.email "bot@ruchitdalwadi.com"
          git add content-bank distribution
          if ! git diff --cached --quiet; then
            git commit -m "campaign: story factory week $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
